<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log Decoder</title><link rel="stylesheet" href="popup.css"></head><body class="standalone"><main><header><div class="logo">🔐</div><div class="title-wrap"><h1>Log Decoder</h1><p>JWT · Base64 · JSON · URL</p></div><button id="closeWindow" class="close-btn">X</button></header><section id="status" class="status"><div id="statusMessage">Paste a value or log line and click Decode.</div><div class="privacy-note">🔒 <strong>Privacy:</strong> All data is processed locally in your browser. Nothing is stored, uploaded, or sent to any external server.</div></section><div class="controls"><label class="toggle"><input id="recursive" type="checkbox" checked><span>Decode nested values</span></label><button id="decode" class="primary">Decode</button></div><textarea id="input" class="standalone-input" placeholder="Paste JWT, Base64, JSON, or a complete log line..."></textarea><section id="result" class="hidden"><div class="result-header"><span id="detected" class="badge">—</span><button id="copy" class="copy-btn">Copy result</button></div><div id="jwtSections" class="hidden"><div class="section-title">Header</div><pre id="jwtHeader" class="code-block"></pre><div class="section-title">Payload</div><pre id="jwtPayload" class="code-block"></pre><div class="section-title">Signature</div><pre id="jwtSignature" class="code-block"></pre></div><div id="normalResult"><div class="section-title">Decoded output</div><pre id="output" class="code-block"></pre></div></section><section id="error" class="error hidden"></section></main><script src="decoder.js"></script><script src="decoder-window.js"></script></body></html>
